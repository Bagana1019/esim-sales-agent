# Тестийн каталог: бот, агент, захиалгын урсгалын тестүүд data/catalog.yaml-ийн үнэ, багц
# өөрчлөгдөхөд эвдрэхгүйн тулд тогтмол 8 багцтай. Бодит каталогийг test_catalog.py шалгана.
# Улс, багцын жагсаалт (Монголын зах зээлд хамгийн их борлуулагддаг 4 улс).
# aliases: харилцагч латинаар г.м. бичих нэрс — бот ойлгоход тусална.
# notes: тухайн улсын талаар бот харилцагчид баттай хэлэх баримт (заавал биш).
# sku нь eSIM сангийн (esim_profiles.package_sku) утгатай таарах ёстой.
countries:
  - code: CN
    name: Хятад
    flag: "🇨🇳"
    aliases: [China, Hytad, Hyatad, Khyatad, Kitad]
    notes: >-
      Манай Хятадын eSIM-ээр Facebook, Instagram, Google, WhatsApp VPN-гүйгээр шууд ажиллана
      (Хятадын дотоодын SIM-ээс ялгаатай).
  - code: KR
    name: БНСУ
    flag: "🇰🇷"
    aliases: [Солонгос, Korea, South Korea, Solongos, BNSU]
  - code: JP
    name: Япон
    flag: "🇯🇵"
    aliases: [Japan, Yapon, Japon, Iapon]
  - code: TH
    name: Тайланд
    flag: "🇹🇭"
    aliases: [Thailand, Tailand, Thai]

packages:
